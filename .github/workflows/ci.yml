name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run skill tests
        run: python -B -m unittest discover -s skills/codex-model-router/tests -p 'test_*.py' -v
      - name: Check public release tree
        run: python -B skills/codex-model-router/scripts/check_public_release.py .
      - name: Validate JSON files
        run: python -B -c "import json, pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('.').rglob('*.json') if '.git' not in p.parts]"
